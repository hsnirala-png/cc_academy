<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Hub Requirements</title>
    <link rel="stylesheet" href="./src/styles.css?v=87" />
    <link rel="stylesheet" href="./src/teacher-hub.css?v=1" />
  </head>
  <body>
    <main class="teacher-hub-wrap teacher-hub-grid">
      <section class="teacher-hub-card">
        <h1>Teacher Requirements</h1>
        <nav class="teacher-hub-nav">
          <a href="./teacher-hub-student.html">Overview</a>
          <a href="./teacher-hub-student-enrollments.html">Enrollments</a>
          <a href="./teacher-hub-student-notices.html">Notices</a>
          <a href="./teacher-hub-student-content.html">Content</a>
        </nav>
        <form id="teacherHubRequirementForm" class="teacher-hub-form">
          <div class="teacher-hub-form-row">
            <label class="teacher-hub-field"><span>Board</span><input id="requirementBoard" /></label>
            <label class="teacher-hub-field"><span>Class Level</span><input id="requirementClassLevel" type="number" min="1" max="12" /></label>
          </div>
          <div class="teacher-hub-form-row">
            <label class="teacher-hub-field"><span>Subject</span><input id="requirementSubject" required /></label>
            <label class="teacher-hub-field">
              <span>Mode</span>
              <select id="requirementMode">
                <option value="ONE_TO_ONE">1:1</option>
                <option value="BATCH">Batch</option>
              </select>
            </label>
          </div>
          <label class="teacher-hub-field"><span>Goals</span><textarea id="requirementGoals"></textarea></label>
          <div class="teacher-hub-actions">
            <button class="btn-primary" type="submit">Submit Requirement</button>
          </div>
        </form>
        <p id="teacherHubRequirementsMessage" class="form-message"></p>
      </section>
      <section class="teacher-hub-card">
        <h2>My Requests</h2>
        <div id="teacherHubRequirementsList" class="teacher-hub-list"></div>
      </section>
    </main>
    <script type="module" src="./src/teacher-hub-student-requirements.js?v=1"></script>
  </body>
</html>
