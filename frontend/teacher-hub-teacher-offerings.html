<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Hub Offerings</title>
    <link rel="stylesheet" href="./src/styles.css?v=87" />
    <link rel="stylesheet" href="./src/teacher-hub.css?v=1" />
  </head>
  <body>
    <main class="teacher-hub-wrap teacher-hub-grid">
      <section class="teacher-hub-card">
        <h1>Teacher Offerings</h1>
        <nav class="teacher-hub-nav">
          <a href="./teacher-hub-teacher-dashboard.html">Dashboard</a>
          <a href="./teacher-hub-teacher-profile.html">Profile</a>
          <a href="./teacher-hub-teacher-board.html">Board, Content & Notices</a>
        </nav>
        <form id="teacherHubOfferingForm" class="teacher-hub-form">
          <div class="teacher-hub-form-row">
            <label class="teacher-hub-field"><span>Title</span><input id="teacherOfferingTitle" required /></label>
            <label class="teacher-hub-field"><span>Subject</span><input id="teacherOfferingSubject" required /></label>
          </div>
          <div class="teacher-hub-form-row">
            <label class="teacher-hub-field"><span>Board</span><input id="teacherOfferingBoard" /></label>
            <label class="teacher-hub-field"><span>Class Level</span><input id="teacherOfferingClassLevel" type="number" min="1" max="12" /></label>
          </div>
          <div class="teacher-hub-form-row">
            <label class="teacher-hub-field"><span>Mode</span><select id="teacherOfferingMode"><option value="ONE_TO_ONE">1:1</option><option value="BATCH">Batch</option></select></label>
            <label class="teacher-hub-field"><span>Billing Cycle</span><select id="teacherOfferingCycle"><option value="DEMO">Demo</option><option value="WEEKLY">Weekly</option><option value="FORTNIGHTLY">Fortnightly</option><option value="MONTHLY">Monthly</option></select></label>
          </div>
          <div class="teacher-hub-form-row">
            <label class="teacher-hub-field"><span>Cycle Price</span><input id="teacherOfferingCyclePrice" type="number" min="0" step="0.01" /></label>
            <label class="teacher-hub-field"><span>Demo Price</span><input id="teacherOfferingDemoPrice" type="number" min="0" step="0.01" /></label>
          </div>
          <div class="teacher-hub-form-row">
            <label class="teacher-hub-field"><span>Batch Capacity</span><input id="teacherOfferingBatchCapacity" type="number" min="1" /></label>
            <label class="teacher-hub-field"><span>Status</span><select id="teacherOfferingStatus"><option value="DRAFT">Draft</option><option value="PUBLISHED">Published</option></select></label>
          </div>
          <label class="teacher-hub-field"><span>Description</span><textarea id="teacherOfferingDescription"></textarea></label>
          <label class="teacher-hub-field"><span>Refund Policy</span><textarea id="teacherOfferingRefundPolicy"></textarea></label>
          <div class="teacher-hub-actions"><button class="btn-primary" type="submit">Save Offering</button></div>
        </form>
        <p id="teacherHubTeacherOfferingsMessage" class="form-message"></p>
      </section>
      <section class="teacher-hub-card">
        <h2>My Offerings</h2>
        <div id="teacherHubTeacherOfferingsList" class="teacher-hub-list"></div>
      </section>
    </main>
    <script type="module" src="./src/teacher-hub-teacher-offerings.js?v=1"></script>
  </body>
</html>
