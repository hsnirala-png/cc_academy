<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Teacher Hub</title>
    <link rel="stylesheet" href="./src/styles.css?v=87" />
    <link rel="stylesheet" href="./src/teacher-hub.css?v=1" />
  </head>
  <body>
    <main class="teacher-hub-wrap teacher-hub-grid">
      <section class="teacher-hub-card">
        <h1>Teacher Hub Admin</h1>
        <nav class="teacher-hub-nav">
          <a href="./admin-teacher-hub-teachers.html">Teachers & KYC</a>
          <a href="./admin-teacher-hub-offerings.html">Offerings</a>
          <a href="./admin-teacher-hub-payouts.html">Payouts</a>
          <a href="./admin-teacher-hub-moderation.html">Moderation</a>
        </nav>
        <p id="adminTeacherHubMessage" class="form-message"></p>
      </section>
      <section class="teacher-hub-grid cols-2">
        <article class="teacher-hub-card"><h2>Teachers</h2><p id="adminTeacherHubTeachersCount">0</p></article>
        <article class="teacher-hub-card"><h2>Offerings</h2><p id="adminTeacherHubOfferingsCount">0</p></article>
      </section>
      <section class="teacher-hub-card">
        <h2>Feature Flags</h2>
        <form id="adminTeacherHubFlagForm" class="teacher-hub-form">
          <div class="teacher-hub-form-row">
            <label class="teacher-hub-field"><span>Scope Type</span><select id="adminTeacherHubFlagScope"><option value="GLOBAL">Global</option><option value="ADMIN">Admin</option><option value="USER">User</option><option value="TEACHER">Teacher</option></select></label>
            <label class="teacher-hub-field"><span>User Id</span><input id="adminTeacherHubFlagUserId" /></label>
          </div>
          <div class="teacher-hub-form-row">
            <label class="teacher-hub-field"><span>Teacher Profile Id</span><input id="adminTeacherHubFlagTeacherProfileId" /></label>
            <label class="teacher-hub-field"><span>Enabled</span><select id="adminTeacherHubFlagEnabled"><option value="true">Enabled</option><option value="false">Disabled</option></select></label>
          </div>
          <label class="teacher-hub-field"><span>Note</span><input id="adminTeacherHubFlagNote" /></label>
          <div class="teacher-hub-actions"><button class="btn-primary" type="submit">Save Feature Flag</button></div>
        </form>
        <div id="adminTeacherHubFlagsList" class="teacher-hub-list"></div>
      </section>
    </main>
    <script type="module" src="./src/admin-teacher-hub.js?v=1"></script>
  </body>
</html>
